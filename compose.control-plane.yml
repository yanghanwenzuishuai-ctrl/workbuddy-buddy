services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: workbuddy
      POSTGRES_USER: workbuddy
      POSTGRES_PASSWORD: workbuddy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbuddy -d workbuddy"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - workbuddy-postgres:/var/lib/postgresql/data

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://workbuddy:workbuddy@postgres:5432/workbuddy
      DATABASE_SSL: "false"
      MIGRATE_ON_START: "true"
      ALLOW_UNVERIFIED_FAKE_EDGE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  workbuddy-postgres:
