[package]
name = "wb-buddy-edge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Privacy-safe signed Edge enrollment and reporting for workbuddy-buddy."

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = "3.0"
getrandom = "0.4"
hex = "0.4"
keyring = "4.1.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
wb-buddy-core = { path = "../core" }

[dev-dependencies]
tempfile = "3"
