<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workbuddy-buddy</title>
<style>
  :root { --bg: transparent; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: var(--bg); gap: 14px; -webkit-user-select: none; user-select: none; }
  #stage { width: 288px; height: 312px; display: flex; align-items: center; justify-content: center; }
  /* pixel-art: crisp nearest-neighbour upscale instead of blur */
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
           filter: drop-shadow(0 6px 8px rgba(0,0,0,.15)); }
  .label { font-size: 12px; color: #7a8296; letter-spacing: .1em; text-transform: uppercase; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 340px; }
  button { border: 1px solid #cdd3e0; background: #fff; border-radius: 8px; padding: 6px 11px;
           font-size: 13px; cursor: pointer; color: #333; }
  button.active { background: #4a6cf7; color: #fff; border-color: #4a6cf7; }
  body.embed .dev, body.embed .label { display: none; }        /* Tauri embeds with ?embed=1 → hide dev chrome */
</style>
</head>
<body>
  <div id="stage"><canvas id="pet" width="192" height="208"></canvas></div>
  <div class="label" id="lbl">idle</div>
  <div class="controls dev" id="ctrls"></div>
<script>
const STATES = ["idle", "working", "waiting", "done", "failed"];
const canvas = document.getElementById("pet");
const ctx = canvas.getContext("2d");
canvas.style.width = "288px"; canvas.style.height = "312px";   // display at 1.5x

let pet = null, sheet = null, cur = "idle", frameIdx = 0, acc = 0, lastT = 0;
let ready = false, pendingState = null;

function validatePet(p) {
  if (!p || !p.frame || !p.frame.width || !p.frame.height || !p.frame.columns)
    throw new Error("pet.json missing frame dimensions");
  if (!p.animations || !p.animations.idle)
    throw new Error("pet.json missing an 'idle' animation");
  if (!p.spritesheetPath) throw new Error("pet.json missing spritesheetPath");
}

function loadSheet(src) {
  return new Promise((res, rej) => {
    sheet = new Image();
    sheet.onload = res;
    sheet.onerror = () => rej(new Error("spritesheet failed to load: " + src));
    sheet.src = src;
  });
}

function renderError(err) {
  console.error("[wb-buddy] load failed:", err);
  document.getElementById("lbl").textContent = "load error";
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#eb5757"; ctx.beginPath();
  ctx.arc(W / 2, H / 2, 40, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "20px system-ui"; ctx.textAlign = "center";
  ctx.fillText("!", W / 2, H / 2 + 7);
}

async function load() {
  const base = "pet/";
  try {
    const r = await fetch(base + "pet.json");
    if (!r.ok) throw new Error("pet.json HTTP " + r.status);
    pet = await r.json();
    validatePet(pet);
    canvas.width = pet.frame.width;
    canvas.height = pet.frame.height;
    await loadSheet(base + pet.spritesheetPath);
    ctx.imageSmoothingEnabled = false;            // crisp pixels on upscale
    buildControls();
    ready = true;
    window.dispatchEvent(new CustomEvent("wbBuddy-ready"));
    if (pendingState) { setState(pendingState); pendingState = null; }
    requestAnimationFrame(loop);
  } catch (e) {
    renderError(e);
  }
}

function anim() { return pet.animations[cur] || pet.animations.idle; }

function loop(t) {
  if (!pet || !sheet) return;
  if (!lastT) lastT = t;
  const dt = t - lastT; lastT = t;
  const a = anim();
  acc += dt;
  const spf = 1000 / (a.fps || 6);
  while (acc >= spf) {
    acc -= spf;
    frameIdx = (frameIdx + 1) % a.frames.length;
    if (!a.loop && frameIdx === 0) frameIdx = a.frames.length - 1;   // clamp one-shot
  }
  draw(a);
  requestAnimationFrame(loop);
}

function draw(a) {
  const { width: W, height: H, columns } = pet.frame;
  const f = a.frames[frameIdx];
  const col = f % columns, row = a.row;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(sheet, col * W, row * H, W, H, 0, 0, W, H);
}

function setState(s) {
  if (!STATES.includes(s)) return;
  if (!ready) { pendingState = s; return; }        // buffer until sprite loaded
  cur = s; frameIdx = 0; acc = 0;
  document.getElementById("lbl").textContent = s;
  [...document.querySelectorAll("#ctrls button")].forEach(b =>
    b.classList.toggle("active", b.dataset.s === s));
}

function buildControls() {
  const c = document.getElementById("ctrls");
  STATES.forEach(s => {
    const b = document.createElement("button");
    b.textContent = s; b.dataset.s = s; b.onclick = () => setState(s);
    c.appendChild(b);
  });
  const demo = document.createElement("button");
  demo.textContent = "▶ demo"; demo.onclick = runDemo;
  c.appendChild(demo);
}

let demoTimer = null;
function runDemo() {
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; return; }
  const seq = ["idle", "working", "waiting", "working", "done", "failed", "idle"];
  let i = 0; setState(seq[0]);
  demoTimer = setInterval(() => { i = (i + 1) % seq.length; setState(seq[i]); }, 1400);
}

// ---- state source contract ----
// Tauri backend pushes a `pet-state` event; a plain web host streams via SSE.
window.wbBuddy = { setState, getState: () => cur, isReady: () => ready };

if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");

if (window.__TAURI__ && window.__TAURI__.event) {
  // Tauri host: subscribe to backend-pushed state events.
  window.__TAURI__.event.listen("pet-state", e => setState((e.payload || "").toString().trim()));
} else {
  // Web host (wb-buddy-bridge): poll the /state endpoint. Errors are ignored so
  // a standalone open (file://, no bridge) still works via the dev controls.
  const poll = async () => {
    try { const r = await fetch("/state", { cache: "no-store" }); if (r.ok) setState((await r.text()).trim()); }
    catch (e) { /* no bridge → dev controls still work */ }
  };
  setInterval(poll, 250);
  poll();
}

load();
</script>
</body>
</html>
