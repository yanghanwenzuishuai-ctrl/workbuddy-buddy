<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workbuddy-buddy</title>
<style>
  :root { --bg: transparent; }
  html, body { margin: 0; height: 100%; position: relative;
    font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: var(--bg); gap: 12px; -webkit-user-select: none; user-select: none;
         overflow: hidden; }
  #stage { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(288px, calc(100vw - 24px)); height: auto;
           image-rendering: pixelated; image-rendering: crisp-edges;
           filter: drop-shadow(0 6px 8px rgba(0,0,0,.15)); }
  .label { font-size: 12px; color: #7a8296; letter-spacing: .1em; text-transform: uppercase; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 340px; }
  .controls button { border: 1px solid #cdd3e0; background: #fff; border-radius: 8px;
           padding: 6px 11px; font-size: 13px; cursor: pointer; color: #333; }
  .controls button.active { background: #4a6cf7; color: #fff; border-color: #4a6cf7; }
  body.embed .dev, body.embed .label { display: none; }
  body.embed #stage { cursor: grab; }
  body.embed #stage:active { cursor: grabbing; }

  /* ---- approval bubble ---- */
  #approval { display: none; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: calc(100vw - 20px); max-width: 300px; box-sizing: border-box;
    background: rgba(255,255,255,.98); border: 1px solid #e3e7f3; border-radius: 14px;
    padding: 12px; box-shadow: 0 10px 30px rgba(30,40,90,.22); z-index: 20; }
  #approval.show { display: block; animation: pop .18s ease-out; }
  @keyframes pop { from { transform: translateX(-50%) scale(.92); opacity: 0; }
                   to   { transform: translateX(-50%) scale(1);   opacity: 1; } }
  #approval .ahead { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #approval .adot { width: 8px; height: 8px; border-radius: 50%; background: #b57ed4; flex: none;
    animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  #approval .atitle { font-size: 12px; font-weight: 700; color: #2b3350; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #approval .count { font-size: 11px; color: #9aa1b8; font-variant-numeric: tabular-nums; flex: none; }
  #approval .atool { display: inline-block; font-size: 11px; font-weight: 600; color: #6a4d94;
    background: #f1e9fb; border-radius: 6px; padding: 1px 8px; margin-bottom: 6px; }
  #approval .adetail { font-size: 11px; line-height: 1.45; color: #56607a;
    font-family: ui-monospace, Menlo, monospace; background: #f6f7fb; border-radius: 8px;
    padding: 6px 8px; margin-bottom: 10px; word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #approval .adetail:empty { display: none; }
  #approval .arow { display: flex; gap: 8px; }
  #approval .arow button { flex: 1; padding: 8px 0; border-radius: 9px; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: filter .1s; }
  #approval .arow button:hover { filter: brightness(.95); }
  #approval .allow { background: #57b25f; border: 1px solid #4a9b52; color: #fff; }
  #approval .deny  { background: #fff; border: 1px solid #eb5757; color: #eb5757; }

  /* ---- buddy picker ---- */
  #picker { display: none; position: absolute; inset: 0; z-index: 30; flex-direction: column;
    background: rgba(248,249,252,.97); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  #picker.show { display: flex; }
  #picker .phead { display: flex; align-items: center; padding: 12px 14px 8px; gap: 8px; }
  #picker .phead b { font-size: 14px; color: #2b3350; flex: 1; }
  #picker .pclose { border: none; background: #eef0f6; color: #667; width: 26px; height: 26px;
    border-radius: 50%; font-size: 15px; cursor: pointer; line-height: 1; }
  #picker .pgrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 4px 12px 14px; }
  #picker .pcard { background: #fff; border: 2px solid #eceef5; border-radius: 12px; padding: 8px 6px 6px;
    text-align: center; cursor: pointer; transition: border-color .12s, transform .08s; }
  #picker .pcard:hover { transform: translateY(-1px); border-color: #cfd6ec; }
  #picker .pcard.sel { border-color: #4a6cf7; background: #f5f8ff; }
  #picker .pcard img { width: 74px; height: 80px; image-rendering: pixelated; object-fit: contain; }
  #picker .pcard .pname { font-size: 11px; font-weight: 600; color: #3a4258; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div id="approval">
    <div class="ahead"><span class="adot"></span><span class="atitle">WorkBuddy 权限请求</span><span class="count"></span></div>
    <span class="atool"></span>
    <div class="adetail"></div>
    <div class="arow"><button class="allow">允许</button><button class="deny">拒绝</button></div>
  </div>
  <div id="picker">
    <div class="phead"><b>选择你的伙伴</b><button class="pclose" title="关闭">✕</button></div>
    <div class="pgrid"></div>
  </div>
  <div id="stage"><canvas id="pet" width="192" height="208"></canvas></div>
  <div class="label" id="lbl">idle</div>
  <div class="controls dev" id="ctrls"></div>
<script>
const STATES = ["idle", "thinking", "working", "review", "waiting", "done", "failed"];
const canvas = document.getElementById("pet");
const ctx = canvas.getContext("2d");

let pet = null, sheet = null, cur = "idle", frameIdx = 0, acc = 0, lastT = 0;
let ready = false, started = false, pendingState = null, activePetId = null;

function validatePet(p) {
  if (!p || !p.frame || !p.frame.width || !p.frame.height || !p.frame.columns)
    throw new Error("pet.json missing frame dimensions");
  if (!p.animations || !p.animations.idle)
    throw new Error("pet.json missing an 'idle' animation");
  if (!p.spritesheetPath) throw new Error("pet.json missing spritesheetPath");
}

function renderError(err) {
  console.error("[wb-buddy] load failed:", err);
  document.getElementById("lbl").textContent = "load error";
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#eb5757"; ctx.beginPath();
  ctx.arc(W / 2, H / 2, 40, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "20px system-ui"; ctx.textAlign = "center";
  ctx.fillText("!", W / 2, H / 2 + 7);
}

// Load (or switch to) a pet from the bundled library. Loads into temp images so
// a failed switch never blanks the current pet.
async function loadPet(id) {
  const base = "pets/" + id + "/";
  try {
    const r = await fetch(base + "pet.json");
    if (!r.ok) throw new Error("pet.json HTTP " + r.status);
    const meta = await r.json();
    validatePet(meta);
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error("spritesheet failed: " + base + meta.spritesheetPath));
      img.src = base + meta.spritesheetPath;
    });
    pet = meta; sheet = img;
    canvas.width = pet.frame.width; canvas.height = pet.frame.height;
    ctx.imageSmoothingEnabled = false;
    frameIdx = 0; acc = 0;
    activePetId = id;
    try { localStorage.setItem("wb-buddy-pet", id); } catch (_) {}
    markPickerSelection();
    if (!ready) {
      ready = true;
      window.dispatchEvent(new CustomEvent("wbBuddy-ready"));
      if (pendingState) { setState(pendingState); pendingState = null; }
    }
    if (!started) { started = true; requestAnimationFrame(loop); }
  } catch (e) {
    if (!pet) renderError(e); else console.error("[wb-buddy] switch failed:", e);
  }
}

async function boot() {
  buildControls();
  let idx = null;
  try { idx = await fetch("pets/index.json").then(r => r.ok ? r.json() : null); } catch (_) {}
  let id = null;
  try { id = localStorage.getItem("wb-buddy-pet"); } catch (_) {}
  if (idx && idx.pets && idx.pets.length) {
    buildPicker(idx.pets);
    const valid = new Set(idx.pets.map(p => p.id));
    if (!id || !valid.has(id)) id = idx.default || idx.pets[0].id;
  } else if (!id) {
    id = "sora-shiba";
  }
  await loadPet(id);
}

function anim() { return pet.animations[cur] || pet.animations.idle; }

function loop(t) {
  if (!pet || !sheet) { requestAnimationFrame(loop); return; }
  if (!lastT) lastT = t;
  const dt = t - lastT; lastT = t;
  const a = anim();
  acc += dt;
  const spf = 1000 / (a.fps || 6);
  while (acc >= spf) {
    acc -= spf;
    frameIdx = (frameIdx + 1) % a.frames.length;
    if (!a.loop && frameIdx === 0) frameIdx = a.frames.length - 1;
  }
  draw(a);
  requestAnimationFrame(loop);
}

function draw(a) {
  const { width: W, height: H, columns } = pet.frame;
  const f = a.frames[frameIdx];
  const col = f % columns, row = a.row;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(sheet, col * W, row * H, W, H, 0, 0, W, H);
}

function setState(s) {
  if (!STATES.includes(s)) return;
  if (!ready) { pendingState = s; return; }
  cur = s; frameIdx = 0; acc = 0;
  document.getElementById("lbl").textContent = s;
  [...document.querySelectorAll("#ctrls button")].forEach(b =>
    b.classList.toggle("active", b.dataset.s === s));
}

function buildControls() {
  const c = document.getElementById("ctrls");
  STATES.forEach(s => {
    const b = document.createElement("button");
    b.textContent = s; b.dataset.s = s; b.onclick = () => setState(s);
    c.appendChild(b);
  });
  const demo = document.createElement("button");
  demo.textContent = "▶ demo"; demo.onclick = runDemo;
  c.appendChild(demo);
  const pick = document.createElement("button");
  pick.textContent = "🐾 buddy"; pick.onclick = openPicker;
  c.appendChild(pick);
}

let demoTimer = null;
function runDemo() {
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; return; }
  const seq = ["idle", "thinking", "working", "review", "waiting", "done", "failed", "idle"];
  let i = 0; setState(seq[0]);
  demoTimer = setInterval(() => { i = (i + 1) % seq.length; setState(seq[i]); }, 1200);
}

// ---- buddy picker ----
const $picker = document.getElementById("picker");
function buildPicker(pets) {
  const grid = $picker.querySelector(".pgrid");
  grid.innerHTML = "";
  pets.forEach(p => {
    const card = document.createElement("div");
    card.className = "pcard"; card.dataset.id = p.id;
    card.title = p.description || p.displayName || p.id;
    const img = document.createElement("img");
    img.src = "pets/" + p.id + "/preview.png"; img.alt = "";
    const name = document.createElement("div");
    name.className = "pname"; name.textContent = p.displayName || p.id;
    card.appendChild(img); card.appendChild(name);
    card.onclick = () => { loadPet(p.id); closePicker(); };
    grid.appendChild(card);
  });
  markPickerSelection();
}
function markPickerSelection() {
  $picker.querySelectorAll(".pcard").forEach(c =>
    c.classList.toggle("sel", c.dataset.id === activePetId));
}
function openPicker() { markPickerSelection(); $picker.classList.add("show"); }
function closePicker() { $picker.classList.remove("show"); }
$picker.querySelector(".pclose").addEventListener("click", closePicker);
$picker.addEventListener("click", e => { if (e.target === $picker) closePicker(); });

// ---- approval bubble ----
const approvalQ = [];
let approvalCur = null, approvalTimer = null;
const $a = document.getElementById("approval");
function renderApproval() {
  if (approvalCur || approvalQ.length === 0) return;
  approvalCur = approvalQ.shift();
  $a.querySelector(".atool").textContent = approvalCur.tool_name || "?";
  $a.querySelector(".adetail").textContent = approvalCur.detail || "";
  let left = Math.max(5, (approvalCur.seconds || 50) - 2);
  const cnt = $a.querySelector(".count");
  cnt.textContent = left + "s";
  approvalTimer = setInterval(() => {
    left -= 1; cnt.textContent = left + "s";
    if (left <= 0) dismissApproval();
  }, 1000);
  $a.classList.add("show");
  setState("waiting");
}
function dismissApproval() {
  if (approvalTimer) { clearInterval(approvalTimer); approvalTimer = null; }
  $a.classList.remove("show");
  approvalCur = null;
  renderApproval();
}
function decideApproval(decision) {
  if (!approvalCur) return;
  if (window.__TAURI__ && window.__TAURI__.event)
    window.__TAURI__.event.emit("pet-decision", { id: approvalCur.id, decision });
  dismissApproval();
}
$a.querySelector(".allow").addEventListener("click", () => decideApproval("allow"));
$a.querySelector(".deny").addEventListener("click", () => decideApproval("deny"));

// ---- state source contract ----
window.wbBuddy = {
  setState, getState: () => cur, isReady: () => ready,
  loadPet, openPicker, getPet: () => activePetId,
  _testApproval: p => { approvalQ.push(p || { id: 0, tool_name: "Bash", detail: "ls -la", seconds: 50 }); renderApproval(); },
};

if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");

// double-click the pet to choose a buddy (works in any host)
document.getElementById("stage").addEventListener("dblclick", openPicker);

if (window.__TAURI__ && window.__TAURI__.event) {
  window.__TAURI__.event.listen("pet-state", e => setState((e.payload || "").toString().trim()));
  window.__TAURI__.event.listen("open-picker", () => openPicker());
  window.__TAURI__.event.listen("pet-approval", e => { approvalQ.push(e.payload || {}); renderApproval(); });
  window.__TAURI__.event.listen("pet-approval-done", e => {
    const id = (e.payload || {}).id;
    if (approvalCur && approvalCur.id === id) dismissApproval();
    else { const i = approvalQ.findIndex(x => x.id === id); if (i >= 0) approvalQ.splice(i, 1); }
  });
  try {
    const w = window.__TAURI__.window;
    const appWin = w && (w.getCurrentWindow || w.getCurrent) ? (w.getCurrentWindow || w.getCurrent).call(w) : null;
    if (appWin) {
      document.getElementById("stage").addEventListener("mousedown", (e) => {
        if (e.button === 0) { try { appWin.startDragging(); } catch (_) {} }
      });
    }
  } catch (_) {}
} else {
  const poll = async () => {
    try { const r = await fetch("/state", { cache: "no-store" }); if (r.ok) setState((await r.text()).trim()); }
    catch (e) {}
  };
  setInterval(poll, 250);
  poll();
}

boot();
</script>
</body>
</html>
