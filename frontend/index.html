<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workbuddy-buddy</title>
<style>
  :root { --bg: transparent; }
  html, body { margin: 0; height: 100%; position: relative;
    font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: var(--bg); gap: 12px; -webkit-user-select: none; user-select: none;
         overflow: hidden; }
  #stage { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(288px, calc(100vw - 24px)); height: auto;
           image-rendering: pixelated; image-rendering: crisp-edges;
           filter: drop-shadow(0 6px 8px rgba(0,0,0,.15)); }
  .label { font-size: 12px; color: #7a8296; letter-spacing: .1em; text-transform: uppercase; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 340px; }
  .controls button { border: 1px solid #cdd3e0; background: #fff; border-radius: 8px;
           padding: 6px 11px; font-size: 13px; cursor: pointer; color: #333; }
  .controls button.active { background: #4a6cf7; color: #fff; border-color: #4a6cf7; }
  body.embed .dev, body.embed .label { display: none; }
  body.embed #stage { cursor: grab; touch-action: none; }
  body.embed #stage:active { cursor: grabbing; }

  /* ---- approval bubble ---- */
  #approval { display: none; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: calc(100vw - 20px); max-width: 300px; box-sizing: border-box;
    background: rgba(255,255,255,.98); border: 1px solid #e3e7f3; border-radius: 14px;
    padding: 12px; box-shadow: 0 10px 30px rgba(30,40,90,.22); z-index: 20; }
  #approval.show { display: block; animation: pop .18s ease-out; }
  @keyframes pop { from { transform: translateX(-50%) scale(.92); opacity: 0; }
                   to   { transform: translateX(-50%) scale(1);   opacity: 1; } }
  #approval .ahead { display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    min-height: 28px; cursor: grab; }
  #approval .ahead:active { cursor: grabbing; }
  #approval .adot { width: 8px; height: 8px; border-radius: 50%; background: #b57ed4; flex: none;
    animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  #approval .atitle { font-size: 12px; font-weight: 700; color: #2b3350; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #approval .count { font-size: 11px; color: #9aa1b8; font-variant-numeric: tabular-nums; flex: none; }
  #approval .atool { display: inline-block; font-size: 11px; font-weight: 600; color: #6a4d94;
    background: #f1e9fb; border-radius: 6px; padding: 1px 8px; margin-bottom: 6px; }
  #approval .adetail { font-size: 11px; line-height: 1.45; color: #56607a;
    font-family: ui-monospace, Menlo, monospace; background: #f6f7fb; border-radius: 8px;
    padding: 6px 8px; margin-bottom: 10px; word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #approval .adetail:empty { display: none; }
  #approval .arow { display: flex; gap: 8px; }
  #approval .arow button { flex: 1; padding: 8px 0; border-radius: 9px; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: filter .1s; }
  #approval .arow button:hover { filter: brightness(.95); }
  #approval .allow { background: #57b25f; border: 1px solid #4a9b52; color: #fff; }
  #approval .deny  { background: #fff; border: 1px solid #eb5757; color: #eb5757; }

  /* ---- buddy picker ---- */
  #picker { display: none; position: absolute; inset: 0; z-index: 30; flex-direction: column;
    background: rgba(248,249,252,.97); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  #picker.show { display: flex; }
  #picker .phead { display: flex; align-items: center; min-height: 52px; box-sizing: border-box;
    padding: 6px 10px 6px 14px; gap: 8px; cursor: grab; position: sticky; top: 0; z-index: 2;
    background: rgba(248,249,252,.98); border-bottom: 1px solid rgba(221,226,237,.75); }
  #picker .phead:active { cursor: grabbing; }
  .drag-grip { display: inline-grid; place-items: center; width: 22px; height: 32px; flex: none;
    color: #929bb1; font-size: 16px; line-height: 1; letter-spacing: -3px; }
  #picker .phead b { font-size: 14px; color: #2b3350; flex: 1; }
  #picker .pclose { border: none; background: #eef0f6; color: #667; width: 44px; height: 44px;
    border-radius: 50%; font-size: 15px; cursor: pointer; line-height: 1; }
  #picker .pgrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 4px 12px 8px; }
  #picker .pcard { position: relative; background: #fff; border: 2px solid #eceef5; border-radius: 12px;
    padding: 8px 6px 6px; text-align: center; cursor: pointer; transition: border-color .12s, transform .08s; }
  #picker .pcard:hover { transform: translateY(-1px); border-color: #cfd6ec; }
  #picker .pcard.sel { border-color: #4a6cf7; background: #f5f8ff; }
  #picker .pcard img { width: 74px; height: 80px; image-rendering: pixelated; object-fit: contain; }
  #picker .pcard .pph { width: 74px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
  #picker .pcard .pname { font-size: 11px; font-weight: 600; color: #3a4258; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #picker .pbadge { position: absolute; top: 6px; right: 6px; font-size: 9px; background: #4a6cf7;
    color: #fff; border-radius: 5px; padding: 1px 5px; }
  #picker .pempty { grid-column: 1 / -1; text-align: center; color: #9aa1b8; font-size: 12px; padding: 24px; }
  #picker .pfoot { font-size: 10px; color: #9aa1b8; padding: 4px 14px 10px; text-align: center; line-height: 1.6; }
  #picker .pfoot code { background: #eef0f6; border-radius: 4px; padding: 0 4px; }

  /* ---- Control Plane pairing ---- */
  #connect { display: none; position: absolute; inset: 0; z-index: 35; box-sizing: border-box;
    flex-direction: column; gap: 10px; padding: 0 14px 14px;
    overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
    background: rgba(248,249,252,.98); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
  #connect.show { display: flex; }
  #connect > * { flex-shrink: 0; }
  #connect .chead { display: flex; align-items: center; gap: 8px; min-height: 56px;
    position: sticky; top: 0; z-index: 3; cursor: grab;
    background: rgba(248,249,252,.98); border-bottom: 1px solid rgba(221,226,237,.75); }
  #connect .chead:active { cursor: grabbing; }
  #connect .chead b { flex: 1; color: #2b3350; font-size: 15px; }
  #connect .cclose { border: none; width: 44px; height: 44px; border-radius: 50%;
    background: #e9ecf4; color: #667085; cursor: pointer; }
  #connect .cclose:disabled { cursor: wait; opacity: .55; }
  #connect .cintro { margin: 0; color: #687087; font-size: 11px; line-height: 1.55; }
  #connect label { color: #333d55; font-size: 11px; font-weight: 700; }
  #connect .ccode { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 11px 10px;
    border: 1px solid #cfd5e4; border-radius: 10px; outline: none; background: #fff;
    color: #25304a; font: 700 13px/1 ui-monospace, Menlo, monospace; letter-spacing: .03em; }
  #connect .ccode:focus { border-color: #4a6cf7; box-shadow: 0 0 0 3px rgba(74,108,247,.12); }
  #connect .csubmit { border: 0; border-radius: 10px; padding: 10px; min-height: 44px;
    background: #4a6cf7; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
  #connect .csubmit:disabled { cursor: wait; opacity: .55; }
  #connect .csubmit.is-complete { background: #31945a; }
  #connect .cstatus { min-height: 34px; margin: 0; padding: 8px 9px; border-radius: 9px;
    background: #eef1f7; color: #687087; font-size: 11px; line-height: 1.45; }
  #connect .cstatus.ok { background: #e7f7ec; color: #28713a; }
  #connect .cstatus.err { background: #fff0ef; color: #9a3934; }
  #connect .chost { display: flex; align-items: center; gap: 8px; padding: 8px 9px;
    border: 1px solid #dde2ed; border-radius: 9px; background: rgba(255,255,255,.72); }
  #connect .choststatus { flex: 1; margin: 0; color: #687087; font-size: 10px; line-height: 1.4; }
  #connect .chostaction { flex: none; border: 1px solid #bcc6dc; border-radius: 8px;
    min-height: 44px; padding: 6px 8px; background: #fff; color: #3f527f; font-size: 10px; font-weight: 700;
    cursor: pointer; }
  #connect .chostaction[hidden] { display: none; }
  #connect .chostaction:disabled { cursor: wait; opacity: .55; }
  #connect .cprivacy { margin-top: auto; color: #959cad; font-size: 9px; line-height: 1.5; }
  #connect button:focus-visible, #picker button:focus-visible, #picker .pcard:focus-visible {
    outline: 3px solid rgba(74,108,247,.35); outline-offset: 2px; }
  #connect button:active, #picker button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div id="approval">
    <div class="ahead" data-tauri-drag-region="deep" title="按住拖动窗口"><span class="adot"></span><span class="atitle">WorkBuddy 权限请求</span><span class="count"></span></div>
    <span class="atool"></span>
    <div class="adetail"></div>
    <div class="arow"><button class="allow">允许</button><button class="deny">拒绝</button></div>
  </div>
  <div id="picker">
    <div class="phead" data-tauri-drag-region="deep" title="按住拖动窗口">
      <span class="drag-grip" aria-hidden="true">⠿</span>
      <b>选择你的伙伴</b>
      <button class="pclose" type="button" title="关闭" aria-label="关闭伙伴选择">✕</button>
    </div>
    <div class="pgrid"></div>
    <div class="pfoot">把 pet 包放进 <code>~/.workbuddy-buddy/pets/</code> 即可添加自己的伙伴（打开此面板自动刷新）</div>
  </div>
  <div id="connect" role="dialog" aria-modal="true" aria-labelledby="connect-title">
    <div class="chead" data-tauri-drag-region="deep" title="按住拖动窗口">
      <span class="drag-grip" aria-hidden="true">⠿</span>
      <b id="connect-title">挂载到咸鱼办公室</b>
      <button class="cclose" type="button" title="关闭" aria-label="关闭挂载面板">✕</button>
    </div>
    <p class="cintro">先在办公室网页点击“挂载 WorkBuddy”生成一次性配对码，再粘贴到这里。</p>
    <label>
      一次性配对码
      <input class="ccode" inputmode="text" autocomplete="one-time-code"
        autocapitalize="none" spellcheck="false" maxlength="96" placeholder="粘贴网页生成的 43 位配对码">
    </label>
    <button class="csubmit" type="button">确认挂载</button>
    <p class="cstatus" role="status" aria-live="polite">设备私钥只保存在系统钥匙串中。</p>
    <div class="chost">
      <p class="choststatus">正在检查 WorkBuddy…</p>
      <button class="chostaction" type="button" hidden></button>
    </div>
    <p class="cprivacy">仅上传派生状态与官方宠物 ID；不会上传 prompt、回复、工具参数、路径、会话或邮件内容。Agent Mail 邮箱验证将在后续版本单独接入。</p>
  </div>
  <div id="stage"><canvas id="pet" width="192" height="208"></canvas></div>
  <div class="label" id="lbl">idle</div>
  <div class="controls dev" id="ctrls"></div>
<script>
const STATES = [
  "idle", "thinking", "working", "review", "waiting", "done", "failed",
  "slacking", "slacking_salted", "slacking_costume", "slacking_shared_fish",
];
const APPROVAL = "http://127.0.0.1:8792";   // Tauri approval/pet server (absent in bridge/browser)
const canvas = document.getElementById("pet");
const ctx = canvas.getContext("2d");

let pet = null, sheet = null, cur = "idle", frameIdx = 0, acc = 0, lastT = 0;
let ready = false, started = false, pendingState = null, activeKey = null;
let petList = [], bundledCache = null, defaultId = null;

const petKey = p => p.source + ":" + p.id;

function validatePet(p) {
  if (!p || !p.frame || !p.frame.width || !p.frame.height || !p.frame.columns)
    throw new Error("pet.json missing frame dimensions");
  if (!p.animations || !p.animations.idle)
    throw new Error("pet.json missing an 'idle' animation");
  if (!p.spritesheetPath) throw new Error("pet.json missing spritesheetPath");
}

function renderError(err) {
  console.error("[wb-buddy] load failed:", err);
  document.getElementById("lbl").textContent = "load error";
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#eb5757"; ctx.beginPath();
  ctx.arc(W / 2, H / 2, 40, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "20px system-ui"; ctx.textAlign = "center";
  ctx.fillText("!", W / 2, H / 2 + 7);
}

// Load (or switch to) a pet descriptor {id, base, source}. base ends in "/".
// Loads into temp images so a failed switch never blanks the current pet.
async function loadPetDesc(p) {
  const base = p.base;
  try {
    const r = await fetch(base + "pet.json");
    if (!r.ok) throw new Error("pet.json HTTP " + r.status);
    const meta = await r.json();
    validatePet(meta);
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error("spritesheet failed: " + base + meta.spritesheetPath));
      img.src = base + meta.spritesheetPath;
    });
    pet = meta; sheet = img;
    canvas.width = pet.frame.width; canvas.height = pet.frame.height;
    // Optional per-pet display scale (default 1). Shrink the canvas AND the
    // window together so a compact pet takes minimal screen space and its
    // transparent margins don't block clicks on what's behind.
    const scale = Number(meta.displayScale) || 1;
    const dispW = Math.round(pet.frame.width * scale);
    const dispH = Math.round(pet.frame.height * scale);
    canvas.style.width = dispW + "px";
    canvas.style.height = dispH + "px";
    try {
      const w = window.__TAURI__ && window.__TAURI__.window;
      const win = w && (w.getCurrentWindow || w.getCurrent) ? (w.getCurrentWindow || w.getCurrent).call(w) : null;
      if (win && win.setSize) win.setSize({ width: dispW, height: dispH });
    } catch (_) {}
    ctx.imageSmoothingEnabled = false;
    frameIdx = 0; acc = 0;
    activeKey = petKey(p);
    try { localStorage.setItem("wb-buddy-pet", activeKey); } catch (_) {}
    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.emit("pet-selection-changed", { source: p.source, id: p.id });
    }
    markPickerSelection();
    if (!ready) {
      ready = true;
      window.dispatchEvent(new CustomEvent("wbBuddy-ready"));
      if (pendingState) { setState(pendingState); pendingState = null; }
    }
    if (!started) { started = true; requestAnimationFrame(loop); }
  } catch (e) {
    if (!pet) renderError(e); else console.error("[wb-buddy] switch failed:", e);
  }
}

// Merge the built-in library (embedded) with user drop-in packs (served by the
// desktop app from ~/.workbuddy-buddy/pets/). Re-fetches user packs each call.
async function refreshLibrary() {
  if (!bundledCache) {
    try {
      const idx = await fetch("pets/index.json").then(r => r.ok ? r.json() : null);
      defaultId = idx && idx.default;
      bundledCache = (idx && idx.pets || []).map(p => ({
        id: p.id, displayName: p.displayName, description: p.description,
        source: "builtin", base: "pets/" + p.id + "/", preview: "pets/" + p.id + "/preview.png",
      }));
    } catch (_) { bundledCache = []; }
  }
  let user = [];
  try {
    const us = await fetch(APPROVAL + "/userpets").then(r => r.ok ? r.json() : null);
    if (Array.isArray(us)) user = us.map(p => ({
      id: p.id, displayName: p.displayName, description: p.description,
      source: "user", base: APPROVAL + "/userpets/" + p.id + "/",
      preview: p.preview ? APPROVAL + "/userpets/" + p.id + "/preview.png" : null,
    }));
  } catch (_) {}
  petList = [...bundledCache, ...user];
  buildPicker(petList);
}

async function boot() {
  buildControls();
  await refreshLibrary();
  let key = null;
  try { key = localStorage.getItem("wb-buddy-pet"); } catch (_) {}
  let chosen = petList.find(p => petKey(p) === key)
            || petList.find(p => p.source === "builtin" && p.id === defaultId)
            || petList.find(p => p.source === "builtin")
            || petList[0];
  if (chosen) await loadPetDesc(chosen);
  else renderError(new Error("no pets found"));
}

function anim() { return pet.animations[cur] || pet.animations.idle; }

function loop(t) {
  if (!pet || !sheet) { requestAnimationFrame(loop); return; }
  if (!lastT) lastT = t;
  const dt = t - lastT; lastT = t;
  const a = anim();
  acc += dt;
  const spf = 1000 / (a.fps || 6);
  while (acc >= spf) {
    acc -= spf;
    frameIdx = (frameIdx + 1) % a.frames.length;
    if (!a.loop && frameIdx === 0) frameIdx = a.frames.length - 1;
  }
  draw(a);
  requestAnimationFrame(loop);
}

function draw(a) {
  const { width: W, height: H, columns } = pet.frame;
  const f = a.frames[frameIdx];
  const col = f % columns, row = a.row;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(sheet, col * W, row * H, W, H, 0, 0, W, H);
}

function setState(s) {
  if (!STATES.includes(s)) return false;
  if (!ready) { pendingState = s; return false; }
  const changed = cur !== s;
  cur = s;
  if (changed) { frameIdx = 0; acc = 0; }
  document.getElementById("lbl").textContent = s;
  [...document.querySelectorAll("#ctrls button")].forEach(b =>
    b.classList.toggle("active", b.dataset.s === s));
  return changed;
}

function buildControls() {
  const c = document.getElementById("ctrls");
  STATES.forEach(s => {
    const b = document.createElement("button");
    b.textContent = s; b.dataset.s = s; b.onclick = () => setState(s);
    c.appendChild(b);
  });
  const demo = document.createElement("button");
  demo.textContent = "▶ demo"; demo.onclick = runDemo;
  c.appendChild(demo);
  const pick = document.createElement("button");
  pick.textContent = "🐾 buddy"; pick.onclick = openPicker;
  c.appendChild(pick);
}

let demoTimer = null;
function runDemo() {
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; return; }
  const seq = [...STATES, "idle"];
  let i = 0; setState(seq[0]);
  demoTimer = setInterval(() => { i = (i + 1) % seq.length; setState(seq[i]); }, 1200);
}

// ---- buddy picker ----
const $picker = document.getElementById("picker");
function thumb(p) {
  if (p.preview) {
    const img = document.createElement("img"); img.src = p.preview; img.alt = "";
    img.onerror = () => img.replaceWith(placeholder());
    return img;
  }
  return placeholder();
}
function placeholder() { const d = document.createElement("div"); d.className = "pph"; d.textContent = "🐾"; return d; }
function buildPicker(pets) {
  const grid = $picker.querySelector(".pgrid");
  grid.innerHTML = "";
  if (!pets.length) { grid.innerHTML = '<div class="pempty">还没有伙伴</div>'; return; }
  pets.forEach(p => {
    const card = document.createElement("div");
    card.className = "pcard"; card.dataset.key = petKey(p);
    card.title = p.description || p.displayName || p.id;
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.appendChild(thumb(p));
    const name = document.createElement("div");
    name.className = "pname"; name.textContent = p.displayName || p.id;
    card.appendChild(name);
    if (p.source === "user") {
      const badge = document.createElement("span");
      badge.className = "pbadge"; badge.textContent = "自定义";
      card.appendChild(badge);
    }
    const selectPet = () => { loadPetDesc(p); closePicker(); };
    card.onclick = selectPet;
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        selectPet();
      }
    });
    grid.appendChild(card);
  });
  markPickerSelection();
}
function markPickerSelection() {
  $picker.querySelectorAll(".pcard").forEach(c => c.classList.toggle("sel", c.dataset.key === activeKey));
}
async function openPicker() {
  if (pairingInFlight) {
    setConnectStatus("正在完成当前挂载，请稍候；完成后即可切换伙伴。");
    $connectSubmit.focus();
    return;
  }
  const navigationId = ++panelNavigationId;
  invalidatePairingAttempt();
  await refreshLibrary();
  if (navigationId !== panelNavigationId || pairingInFlight) return;
  markPickerSelection();
  $connect.classList.remove("show");
  $picker.classList.add("show");
  syncPanelMode();
  reportHit();
  setTimeout(() => $picker.querySelector(".pclose").focus(), 0);
}
function closePicker() {
  panelNavigationId += 1;
  $picker.classList.remove("show");
  syncPanelMode();
  reportHit();
}
$picker.querySelector(".pclose").addEventListener("click", closePicker);
$picker.addEventListener("click", e => { if (e.target === $picker) closePicker(); });

// ---- Control Plane pairing ----
const $connect = document.getElementById("connect");
const $connectCode = $connect.querySelector(".ccode");
const $connectSubmit = $connect.querySelector(".csubmit");
const $connectClose = $connect.querySelector(".cclose");
const $connectStatus = $connect.querySelector(".cstatus");
const $connectHostStatus = $connect.querySelector(".choststatus");
const $connectHostAction = $connect.querySelector(".chostaction");
const PAIRING_CODE_PATTERN = /^[A-Za-z0-9_-]{43}$/;
let workBuddyStatus = null;
let pairingInFlight = false;
let pairingComplete = false;
let pairingAttemptId = 0;
let panelNavigationId = 0;
let panelModeOpen = false;
let pendingConsumeInFlight = false;
let pendingConsumeRequested = false;
let deferredConnectRequest = null;
let deferredOpenWithoutPending = false;

function syncPanelMode() {
  const open = $picker.classList.contains("show") || $connect.classList.contains("show");
  if (open === panelModeOpen) return;
  panelModeOpen = open;
  const events = window.__TAURI__ && window.__TAURI__.event;
  if (events) events.emit("window-panel-mode", { open });
}

function resetPairingControls() {
  invalidatePairingAttempt();
  pairingComplete = false;
  $connectCode.disabled = false;
  $connectSubmit.disabled = false;
  $connectClose.disabled = false;
  $connectHostAction.disabled = false;
  $connectHostAction.hidden = true;
  $connectHostStatus.textContent = "正在检查 WorkBuddy…";
  workBuddyStatus = null;
  $connectSubmit.textContent = "确认挂载";
  $connectSubmit.classList.remove("is-complete");
}

function invalidatePairingAttempt() {
  pairingAttemptId += 1;
  pairingInFlight = false;
}

function showPairingComplete() {
  pairingComplete = true;
  $connectCode.disabled = true;
  $connectSubmit.disabled = true;
  $connectSubmit.textContent = "完成并返回桌宠";
  $connectSubmit.classList.add("is-complete");
}
function setConnectStatus(message, kind = "") {
  $connectStatus.textContent = message;
  $connectStatus.className = "cstatus" + (kind ? " " + kind : "");
}
function isCurrentConnectNavigation(navigationId) {
  return navigationId === panelNavigationId && $connect.classList.contains("show");
}
function renderWorkBuddyStatus(status) {
  workBuddyStatus = status || null;
  $connectHostAction.hidden = true;
  if (!status) {
    $connectHostStatus.textContent = "暂时无法检查 WorkBuddy 安装状态。";
    return;
  }
  if (!status.hostInstalled) {
    $connectHostStatus.textContent = "未检测到 WorkBuddy；先安装官方客户端，回来后可继续启用状态同步。";
    $connectHostAction.textContent = "下载 WorkBuddy";
    $connectHostAction.hidden = false;
    return;
  }
  if (!status.pluginConfigured) {
    $connectHostStatus.textContent = "已检测到 WorkBuddy；配对成功后会自动注册隐私安全的状态插件。";
    $connectHostAction.textContent = "安装状态插件";
    $connectHostAction.hidden = false;
    return;
  }
  if (!status.marketplaceAvailable) {
    $connectHostStatus.textContent = "状态插件已注册；重启 WorkBuddy 后会自动安装并生效。";
    return;
  }
  $connectHostStatus.textContent = "WorkBuddy 状态插件已启用。";
}
async function refreshWorkBuddyStatus(navigationId = null) {
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
  if (!invoke) {
    if (navigationId === null || isCurrentConnectNavigation(navigationId)) {
      renderWorkBuddyStatus(null);
    }
    return;
  }
  try {
    const status = await invoke("workbuddy_integration_status");
    if (navigationId === null || isCurrentConnectNavigation(navigationId)) {
      renderWorkBuddyStatus(status);
    }
  } catch (_) {
    if (navigationId === null || isCurrentConnectNavigation(navigationId)) {
      renderWorkBuddyStatus(null);
    }
  }
}
async function configureWorkBuddyPlugin(navigationId = panelNavigationId) {
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
  if (!invoke) return null;
  if (isCurrentConnectNavigation(navigationId)) $connectHostAction.disabled = true;
  try {
    const status = await invoke("configure_workbuddy_plugin");
    if (isCurrentConnectNavigation(navigationId)) renderWorkBuddyStatus(status);
    return status;
  } finally {
    if (isCurrentConnectNavigation(navigationId)) $connectHostAction.disabled = false;
  }
}
async function openConnect(prefillCode = null) {
  if (pairingInFlight) {
    setConnectStatus("正在完成当前挂载，请稍候；完成后会自动处理新的配对链接。");
    $connectSubmit.focus();
    return;
  }
  panelNavigationId += 1;
  const navigationId = panelNavigationId;
  $picker.classList.remove("show");
  resetPairingControls();
  const hasPrefill = typeof prefillCode === "string" && PAIRING_CODE_PATTERN.test(prefillCode);
  $connectCode.value = hasPrefill ? prefillCode : "";
  $connect.classList.add("show");
  syncPanelMode();
  setConnectStatus("正在检查当前挂载状态…");
  reportHit();
  setTimeout(() => (hasPrefill ? $connectSubmit : $connectCode).focus(), 0);
  refreshWorkBuddyStatus(navigationId);
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
  if (!invoke) {
    setConnectStatus("请从 WorkBuddy Buddy 桌面应用打开此面板。", "err");
    return;
  }
  try {
    const status = await invoke("edge_connection_status");
    if (!isCurrentConnectNavigation(navigationId)) return;
    if (status && status.connected) {
      setConnectStatus("这只桌宠已挂载。重新输入配对码会切换到新的办公室。", "ok");
    } else if (status && status.credential_expired) {
      setConnectStatus("设备凭证已过期，请在网页上重新生成配对码。", "err");
    } else if (status && status.configured && !status.credential_available) {
      setConnectStatus("挂载配置存在，但系统钥匙串暂不可用；应用会自动重试。", "err");
    } else {
      setConnectStatus("设备私钥只会写入系统钥匙串。");
    }
    if (hasPrefill) {
      setConnectStatus("配对码已预填；应用不会自动挂载，请核对后点击“确认挂载”。");
    }
  } catch (_) {
    if (isCurrentConnectNavigation(navigationId)) {
      setConnectStatus("暂时无法读取挂载状态，请稍后重试。", "err");
    }
  }
}
async function consumePendingConnect(openWithoutPending = false) {
  deferredOpenWithoutPending ||= openWithoutPending;
  pendingConsumeRequested = true;
  // Coalesce concurrent cold-start/event consumers. If enrollment begins while
  // Rust is handing us a request, retain it locally until that attempt finishes.
  if (pairingInFlight || pendingConsumeInFlight) return;
  pendingConsumeInFlight = true;
  try {
    const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
    while (pendingConsumeRequested && !pairingInFlight) {
      pendingConsumeRequested = false;
      let request = null;
      if (invoke) {
        try { request = await invoke("take_pending_connect"); } catch (_) {}
      }
      if (request) deferredConnectRequest = request;
    }
    if (pairingInFlight) return;

    const request = deferredConnectRequest;
    deferredConnectRequest = null;
    const shouldOpenEmpty = deferredOpenWithoutPending
      && !request
      && !$connect.classList.contains("show");
    deferredOpenWithoutPending = false;
    const code = request && typeof request.pairingCode === "string"
      && PAIRING_CODE_PATTERN.test(request.pairingCode) ? request.pairingCode : null;
    if (request) await openConnect(code);
    else if (shouldOpenEmpty) await openConnect(null);
  } finally {
    pendingConsumeInFlight = false;
    if (pendingConsumeRequested && !pairingInFlight) {
      setTimeout(() => consumePendingConnect(false), 0);
    }
  }
}
function closeConnect() {
  if (pairingInFlight) {
    setConnectStatus("正在完成挂载，请稍候；为避免凭证被切换，当前不能关闭。");
    $connectSubmit.focus();
    return;
  }
  panelNavigationId += 1;
  invalidatePairingAttempt();
  $connect.classList.remove("show");
  syncPanelMode();
  reportHit();
}
async function submitPairing() {
  if (pairingComplete) {
    closeConnect();
    return;
  }
  if (pairingInFlight) return;
  const attemptId = ++pairingAttemptId;
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
  const pairingCode = $connectCode.value.trim();
  if (!invoke || !PAIRING_CODE_PATTERN.test(pairingCode)) {
    setConnectStatus("请输入网页生成的 43 位完整配对码。", "err");
    return;
  }
  panelNavigationId += 1;
  const navigationId = panelNavigationId;
  pairingInFlight = true;
  $connectSubmit.disabled = true;
  $connectClose.disabled = true;
  setConnectStatus("正在生成设备密钥并完成挂载…");
  try {
    await invoke("pair_office", { pairingCode });
    if (attemptId !== pairingAttemptId) return;
    $connectCode.value = "";
    let pluginStatus = null;
    try {
      pluginStatus = await configureWorkBuddyPlugin(navigationId);
    } catch (_) {}
    if (attemptId !== pairingAttemptId) return;
    if (pluginStatus && pluginStatus.hostInstalled && !pluginStatus.marketplaceAvailable) {
      setConnectStatus("挂载成功！请重启一次 WorkBuddy，让状态插件安装并生效。", "ok");
    } else if (pluginStatus && !pluginStatus.hostInstalled) {
      setConnectStatus("挂载成功！安装 WorkBuddy 后，再点击下方“安装状态插件”。", "ok");
    } else {
      setConnectStatus("挂载成功！真实状态会在几秒内出现在办公室。", "ok");
    }
    showPairingComplete();
  } catch (error) {
    if (attemptId === pairingAttemptId) {
      setConnectStatus(typeof error === "string" ? error : "挂载失败，请重新生成配对码。", "err");
    }
  } finally {
    if (attemptId === pairingAttemptId) {
      pairingInFlight = false;
      $connectSubmit.disabled = false;
      $connectClose.disabled = false;
      if (pairingComplete) $connectSubmit.focus();
      // A deep link may have arrived while this attempt was running.
      setTimeout(() => consumePendingConnect(false), 0);
    }
  }
}
$connectClose.addEventListener("click", closeConnect);
$connectSubmit.addEventListener("click", submitPairing);
$connectHostAction.addEventListener("click", async () => {
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
  if (!invoke) return;
  const navigationId = panelNavigationId;
  if (!workBuddyStatus || !workBuddyStatus.hostInstalled) {
    try { await invoke("open_workbuddy_download"); } catch (_) {
      if (isCurrentConnectNavigation(navigationId)) {
        setConnectStatus("无法打开下载页，请访问 workbuddy.cn。", "err");
      }
    }
    return;
  }
  try {
    const status = await configureWorkBuddyPlugin(navigationId);
    if (isCurrentConnectNavigation(navigationId) && status && status.pluginConfigured) {
      setConnectStatus("状态插件已注册；重启一次 WorkBuddy 后自动生效。", "ok");
    }
  } catch (error) {
    if (isCurrentConnectNavigation(navigationId)) {
      setConnectStatus(typeof error === "string" ? error : "状态插件安装失败，请稍后重试。", "err");
    }
  }
});
$connectCode.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    submitPairing();
  }
});

function trapPanelFocus(panel, event) {
  const focusable = Array.from(panel.querySelectorAll(
    'button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )).filter(element => element.getClientRects().length > 0);
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault(); last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault(); first.focus();
  }
}

window.addEventListener("keydown", event => {
  const activePanel = $connect.classList.contains("show")
    ? $connect
    : ($picker.classList.contains("show") ? $picker : null);
  if (!activePanel) return;
  if (event.key === "Escape") {
    event.preventDefault();
    activePanel === $connect ? closeConnect() : closePicker();
  } else if (event.key === "Tab") {
    trapPanelFocus(activePanel, event);
  }
});

// ---- approval bubble ----
const approvalQ = [];
let approvalCur = null, approvalTimer = null;
const $a = document.getElementById("approval");
function renderApproval() {
  if (approvalCur || approvalQ.length === 0) return;
  approvalCur = approvalQ.shift();
  $a.querySelector(".atool").textContent = approvalCur.tool_name || "?";
  $a.querySelector(".adetail").textContent = approvalCur.detail || "";
  let left = Math.max(5, (approvalCur.seconds || 50) - 2);
  const cnt = $a.querySelector(".count");
  cnt.textContent = left + "s";
  approvalTimer = setInterval(() => {
    left -= 1; cnt.textContent = left + "s";
    if (left <= 0) dismissApproval();
  }, 1000);
  $a.classList.add("show");
  setState("waiting");
  reportHit();
}
function dismissApproval() {
  if (approvalTimer) { clearInterval(approvalTimer); approvalTimer = null; }
  $a.classList.remove("show");
  approvalCur = null;
  reportHit();
  renderApproval();
}
function decideApproval(decision) {
  if (!approvalCur) return;
  if (window.__TAURI__ && window.__TAURI__.event)
    window.__TAURI__.event.emit("pet-decision", { id: approvalCur.id, decision });
  dismissApproval();
}
$a.querySelector(".allow").addEventListener("click", () => decideApproval("allow"));
$a.querySelector(".deny").addEventListener("click", () => decideApproval("deny"));

// ---- click-through hit region (native app only) ----
// Report the pet's opaque silhouette (or "whole window" when a panel is up) so the
// Rust side can let clicks fall through the transparent margins around the sprite.
function isFullInteractive() {
  return document.getElementById("picker").classList.contains("show")
      || document.getElementById("approval").classList.contains("show")
      || document.getElementById("connect").classList.contains("show");
}
function opaqueBBox() {
  try {
    const w = canvas.width, h = canvas.height;
    const d = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 12) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    return maxX < 0 ? null : { minX, minY, maxX, maxY };
  } catch (_) { return null; }
}
let __lastHit = "";
function reportHit() {
  const T = window.__TAURI__ && window.__TAURI__.event;
  if (!T) return;
  const bb = isFullInteractive() ? null : opaqueBBox();
  const r = canvas.getBoundingClientRect();
  let payload;
  if (!bb || !r.width) {
    payload = { full: true };                       // panel up or not ready → whole window live
  } else {
    const sx = r.width / canvas.width, sy = r.height / canvas.height, pad = 12;
    payload = { full: false,
      x: r.left + bb.minX * sx - pad, y: r.top + bb.minY * sy - pad,
      w: (bb.maxX - bb.minX + 1) * sx + pad * 2, h: (bb.maxY - bb.minY + 1) * sy + pad * 2 };
  }
  const k = JSON.stringify(payload).replace(/\.\d+/g, "");   // ignore sub-pixel jitter
  if (k === __lastHit) return;
  __lastHit = k;
  T.emit("pet-hit", payload);
}

// ---- state source contract ----
window.wbBuddy = {
  setState, getState: () => cur, isReady: () => ready,
  openPicker, openConnect, getPet: () => activeKey, refreshLibrary,
  _getAnimationState: () => pet && pet.animations[cur] ? cur : "idle",
  _getFrameIndex: () => frameIdx,
  _testApproval: p => { approvalQ.push(p || { id: 0, tool_name: "Bash", detail: "ls -la", seconds: 50 }); renderApproval(); },
};

if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");

if (window.__TAURI__ && window.__TAURI__.event) {
  window.__TAURI__.event.listen("pet-state", e => setState((e.payload || "").toString().trim()));
  window.__TAURI__.event.listen("open-picker", () => openPicker());
  window.__TAURI__.event.listen("open-connect", () => consumePendingConnect(true));
  window.__TAURI__.event.listen("pet-approval", e => { approvalQ.push(e.payload || {}); renderApproval(); });
  window.__TAURI__.event.listen("pet-approval-done", e => {
    const id = (e.payload || {}).id;
    if (approvalCur && approvalCur.id === id) dismissApproval();
    else { const i = approvalQ.findIndex(x => x.id === id); if (i >= 0) approvalQ.splice(i, 1); }
  });
  // Pet interactions (Codex-pet style): left-click → bring WorkBuddy to front;
  // drag (move > 4px while pressed) → move the window; right-click → buddy picker.
  try {
    const w = window.__TAURI__.window;
    const appWin = w && (w.getCurrentWindow || w.getCurrent) ? (w.getCurrentWindow || w.getCurrent).call(w) : null;
    const stage = document.getElementById("stage");
    let downPt = null, dragged = false;
    stage.addEventListener("mousedown", e => {
      if (e.button !== 0) return;
      downPt = { x: e.screenX, y: e.screenY }; dragged = false;
    });
    stage.addEventListener("mousemove", e => {
      if (downPt && !dragged && appWin &&
          Math.abs(e.screenX - downPt.x) + Math.abs(e.screenY - downPt.y) > 4) {
        dragged = true;
        try { appWin.startDragging(); } catch (_) {}
      }
    });
    window.addEventListener("mouseup", () => { downPt = null; });
    stage.addEventListener("click", () => {
      if (!dragged) window.__TAURI__.event.emit("activate-host");   // click (not drag) → foreground WorkBuddy
    });
    stage.addEventListener("contextmenu", e => { e.preventDefault(); openPicker(); });  // right-click → picker
  } catch (_) {}
  // keep the Rust side's click-through silhouette in sync as the sprite animates
  setInterval(reportHit, 150);
  reportHit();
  // Cold-start deep links can arrive before the webview registers its event
  // listener. Consume the one pending request after the bridge is ready.
  consumePendingConnect(false);
} else {
  // browser/bridge dev mode: double-click opens the picker; poll for state.
  document.getElementById("stage").addEventListener("dblclick", openPicker);
  const poll = async () => {
    try { const r = await fetch("/state", { cache: "no-store" }); if (r.ok) setState((await r.text()).trim()); }
    catch (e) {}
  };
  setInterval(poll, 250);
  poll();
}

boot();
</script>
