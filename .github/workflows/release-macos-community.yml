name: release macOS community test build

on:
  workflow_dispatch:
  push:
    tags:
      - "community-v*"

permissions:
  contents: write

concurrency:
  group: macos-community-release
  cancel-in-progress: false

env:
  COMMUNITY_TAG: community-latest

jobs:
  prepare:
    name: Prepare community release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Verify community source
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Verify contracts, control plane, plugin, and desktop app
        run: |
          npm run test:contracts
          npm run typecheck:control-plane
          npm run test:control-plane
          npm test --prefix integrations/workbuddy-plugin
          cargo test -p wb-buddy-app --locked

  build:
    name: Build macOS ${{ matrix.label }}
    needs:
      - prepare
      - test
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            target: aarch64-apple-darwin
            expected_arch: arm64
            asset: workbuddy-buddy_macos_arm64.dmg
          - label: Intel
            target: x86_64-apple-darwin
            expected_arch: x86_64
            asset: workbuddy-buddy_macos_x64.dmg

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Build app bundle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          npx --yes @tauri-apps/cli@2.11.4 build \
            --target "$TARGET" \
            --bundles app

      - name: Ad-hoc sign, package, and verify DMG
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          set -euo pipefail

          bundle_dir="target/$TARGET/release/bundle/macos"
          app_path="$(find "$bundle_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"

          executable="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$app_path/Contents/Info.plist"
          )"
          binary="$app_path/Contents/MacOS/$executable"
          test -x "$binary"

          actual_archs="$(lipo -archs "$binary")"
          case " $actual_archs " in
            *" $EXPECTED_ARCH "*) ;;
            *)
              echo "Expected $EXPECTED_ARCH, found: $actual_archs" >&2
              exit 1
              ;;
          esac

          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          dmg_root="$RUNNER_TEMP/dmg-root-$TARGET"
          mount_dir="$RUNNER_TEMP/dmg-mount-$TARGET"
          output_dmg="$RUNNER_TEMP/$ASSET_NAME"
          mkdir -p "$dmg_root" "$mount_dir"
          ditto "$app_path" "$dmg_root/workbuddy-buddy.app"
          ln -s /Applications "$dmg_root/Applications"

          hdiutil create \
            -volname "WorkBuddy Buddy Community" \
            -srcfolder "$dmg_root" \
            -format UDZO \
            -ov \
            "$output_dmg"

          cleanup_mount() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach \
            "$output_dmg" \
            -readonly \
            -nobrowse \
            -mountpoint "$mount_dir" \
            >/dev/null

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$mount_dir/workbuddy-buddy.app"

          mounted_executable="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$mount_dir/workbuddy-buddy.app/Contents/Info.plist"
          )"
          mounted_binary="$mount_dir/workbuddy-buddy.app/Contents/MacOS/$mounted_executable"
          mounted_archs="$(lipo -archs "$mounted_binary")"
          case " $mounted_archs " in
            *" $EXPECTED_ARCH "*) ;;
            *)
              echo "DMG expected $EXPECTED_ARCH, found: $mounted_archs" >&2
              exit 1
              ;;
          esac

          cleanup_mount
          trap - EXIT

          cd "$RUNNER_TEMP"
          shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"
          shasum -a 256 -c "$ASSET_NAME.sha256"

      - name: Stage verified community assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: community-${{ matrix.expected_arch }}
          path: |
            ${{ runner.temp }}/${{ matrix.asset }}
            ${{ runner.temp }}/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish complete community release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download both verified architecture builds
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: community-*
          path: community-release-assets
          merge-multiple: true

      - name: Validate complete release set
        run: |
          set -euo pipefail
          cd community-release-assets
          for asset_name in \
            workbuddy-buddy_macos_arm64.dmg \
            workbuddy-buddy_macos_x64.dmg
          do
            test -s "$asset_name"
            test -s "$asset_name.sha256"
            sha256sum -c "$asset_name.sha256"
          done
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"

      - name: Move fixed tag and publish complete asset set
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$COMMUNITY_TAG" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$COMMUNITY_TAG" \
              -f sha="$SOURCE_SHA" \
              -F force=true \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$COMMUNITY_TAG" \
              -f sha="$SOURCE_SHA" \
              >/dev/null
          fi

          body="$(cat <<EOF
          ## Community test build

          This is an ad-hoc-signed, non-notarized macOS test build from commit \`$SOURCE_SHA\`.
          It is not the signed stable release and is not distributed through the App Store.

          Choose **Apple Silicon** for M-series Macs or **Intel** for Intel Macs.
          macOS may require first-time approval in **System Settings → Privacy & Security → Open Anyway**.
          This release never disables or bypasses Gatekeeper automatically.
          EOF
          )"

          if release_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$COMMUNITY_TAG" \
              --jq '.id' \
              2>/dev/null
          )"; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f tag_name="$COMMUNITY_TAG" \
              -f name="WorkBuddy Buddy Community Test Build" \
              -f body="$body" \
              -F draft=false \
              -F prerelease=true \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$COMMUNITY_TAG" \
              -f target_commitish="$SOURCE_SHA" \
              -f name="WorkBuddy Buddy Community Test Build" \
              -f body="$body" \
              -F draft=false \
              -F prerelease=true \
              >/dev/null
          fi

          gh release upload "$COMMUNITY_TAG" \
            community-release-assets/workbuddy-buddy_macos_arm64.dmg \
            community-release-assets/workbuddy-buddy_macos_arm64.dmg.sha256 \
            community-release-assets/workbuddy-buddy_macos_x64.dmg \
            community-release-assets/workbuddy-buddy_macos_x64.dmg.sha256 \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  verify:
    name: Verify community release
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail

          test "$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$COMMUNITY_TAG" \
              --jq '.draft'
          )" = "false"
          test "$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$COMMUNITY_TAG" \
              --jq '.prerelease'
          )" = "true"
          test "$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$COMMUNITY_TAG" \
              --jq '.object.sha'
          )" = "$SOURCE_SHA"

          asset_names="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$COMMUNITY_TAG" \
              --jq '.assets[].name'
          )"
          for asset_name in \
            workbuddy-buddy_macos_arm64.dmg \
            workbuddy-buddy_macos_arm64.dmg.sha256 \
            workbuddy-buddy_macos_x64.dmg \
            workbuddy-buddy_macos_x64.dmg.sha256
          do
            grep -Fxq "$asset_name" <<<"$asset_names"
          done
