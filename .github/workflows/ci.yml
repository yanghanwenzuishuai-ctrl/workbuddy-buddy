name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - name: Protocol contract
        run: |
          npm ci --ignore-scripts
          npm run test:contracts
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt -p wb-buddy-core -p wb-buddy-watch -- --check
      - name: Rust lint
        run: cargo clippy -p wb-buddy-core -p wb-buddy-watch --all-targets --locked -- -D warnings
      - name: Rust tests (pure crates)
        run: cargo test -p wb-buddy-core -p wb-buddy-watch --locked
      - name: Privacy contract
        run: python3 -B hooks/test_privacy.py
