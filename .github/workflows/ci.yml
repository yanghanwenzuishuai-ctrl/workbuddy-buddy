name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - name: Protocol contract
        run: |
          npm ci --ignore-scripts
          npm run test:contracts
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt -p wb-buddy-core -p wb-buddy-watch -- --check
      - name: Rust lint
        run: cargo clippy -p wb-buddy-core -p wb-buddy-watch --all-targets --locked -- -D warnings
      - name: Rust tests (pure crates)
        run: cargo test -p wb-buddy-core -p wb-buddy-watch --locked
      - name: Privacy contract
        run: python3 -B hooks/test_privacy.py

  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: workbuddy_test
          POSTGRES_USER: workbuddy
          POSTGRES_PASSWORD: workbuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbuddy -d workbuddy_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CONTROL_PLANE_TEST_DATABASE_URL: postgres://workbuddy:workbuddy@127.0.0.1:5432/workbuddy_test
      ALLOW_CONTROL_PLANE_TEST_DB_RESET: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: TypeScript and unit tests
        run: |
          npm run typecheck:control-plane
          npm run test:control-plane
      - name: PostgreSQL migrations and ingestion
        run: npm run test:control-plane:integration
      - name: Production build
        run: npm run build --workspace @workbuddy-buddy/control-plane
      - name: Container build
        run: docker build -f apps/control-plane/Dockerfile -t workbuddy-control-plane:ci .
