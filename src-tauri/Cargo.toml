[package]
name = "wb-buddy-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "workbuddy-buddy desktop pet — a transparent always-on-top Tauri window."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
wb-buddy-core = { path = "../crates/core" }
wb-buddy-edge = { path = "../crates/edge" }
wb-buddy-watch = { path = "../crates/watch" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[[bin]]
name = "wb-buddy-app"
path = "src/main.rs"
